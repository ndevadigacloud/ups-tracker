server:
  port: 8081

spring:
  application:
    name: shipment-service
  data:
    mongodb:
      uri: mongodb://localhost:27017/shipments
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: shipment-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.ups.shipment.dto"
        # facility-service publishes CapacityResultEvent from its own package
        # (com.ups.facility.dto). Without this mapping, JsonDeserializer uses
        # the producer's __TypeId__ header verbatim and tries to load a class
        # that doesn't exist in this service's JVM, silently dropping every
        # capacity result and leaving shipments stuck at CREATED.
        spring.json.type.mapping: "capacityResultEvent:com.ups.shipment.dto.CapacityResultEvent,scanEvent:com.ups.shipment.dto.ScanEvent"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        # Send the same logical aliases instead of this service's own class
        # names, so facility-service (or any other consumer) can map them to
        # its own local DTO classes.
        spring.json.type.mapping: "shipmentCreatedEvent:com.ups.shipment.dto.ShipmentCreatedEvent,scanEvent:com.ups.shipment.dto.ScanEvent"

ups:
  kafka:
    topic:
      shipment-created: shipment-created
      capacity-reserved: capacity-reserved
      capacity-rejected: capacity-rejected
      scan-event: scan-event

logging:
  pattern:
    # Timestamp + level + logger on every line so CloudWatch Logs Insights queries
    # can filter/sort on them; shipment/facility ids are embedded in the message
    # itself, so `filter @message like /<id>/` traces one shipment end-to-end.
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"
  level:
    root: INFO
    com.ups.shipment: INFO
    org.springframework.kafka: WARN
    org.apache.kafka: WARN
