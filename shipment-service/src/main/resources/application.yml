server:
  port: 8081

spring:
  application:
    name: shipment-service
  data:
    mongodb:
      uri: mongodb://localhost:27017/shipments
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: shipment-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.ups.shipment.dto"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

ups:
  kafka:
    topic:
      shipment-created: shipment-created
      capacity-reserved: capacity-reserved
      capacity-rejected: capacity-rejected
      scan-event: scan-event

logging:
  pattern:
    # Timestamp + level + logger on every line so CloudWatch Logs Insights queries
    # can filter/sort on them; shipment/facility ids are embedded in the message
    # itself, so `filter @message like /<id>/` traces one shipment end-to-end.
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"
  level:
    root: INFO
    com.ups.shipment: INFO
    org.springframework.kafka: WARN
    org.apache.kafka: WARN
