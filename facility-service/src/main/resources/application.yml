server:
  port: 8082

spring:
  application:
    name: facility-service
  data:
    mongodb:
      uri: mongodb://localhost:27017/facilities
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: facility-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.ups.facility.dto"
        # shipment-service publishes ShipmentCreatedEvent from its own package
        # (com.ups.shipment.dto) - map the shared alias to this service's own
        # local class instead of trusting/loading the producer's class name.
        spring.json.type.mapping: "shipmentCreatedEvent:com.ups.facility.dto.ShipmentCreatedEvent"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.type.mapping: "capacityResultEvent:com.ups.facility.dto.CapacityResultEvent"

ups:
  kafka:
    topic:
      shipment-created: shipment-created
      capacity-reserved: capacity-reserved
      capacity-rejected: capacity-rejected

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"
  level:
    root: INFO
    com.ups.facility: INFO
    org.springframework.kafka: WARN
    org.apache.kafka: WARN
